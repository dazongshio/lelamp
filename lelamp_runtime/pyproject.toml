[project]
name = "lelamp-runtime"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dashscope>=1.25.0",
    "feetech-servo-sdk>=1.0.0",
    "lerobot>=0.3.3",
    "livekit-agents[openai]~=1.2",
    "livekit-plugins-noise-cancellation~=0.2",
    "numpy>=2.2.6",
    "pvporcupine>=3.0.5",
    "pvrecorder>=1.2.7",
    "pyarrow==20.0.0",
    "pyaudio>=0.2.14",
    "python-dotenv",
    "sounddevice>=0.5.2",
    "websocket-client>=1.8.0",
    "webrtcvad-wheels>=2.0.14",
    "ultralytics>=8.4.48",
]

[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot" }

[project.optional-dependencies]
hardware = [
    "adafruit-circuitpython-neopixel",
    "rpi-ws281x",
]
meeting = [
    "faster-whisper>=1.1.0",
    "whisperx>=3.3.0",
]
documents = [
    "paddleocr>=2.8.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]
desktop = [
    "browser-use>=0.1.40",
    "playwright>=1.49.0",
]
local-ai = [
    "piper-tts>=1.2.0",
]
