# Managed by LeLamp hardware profile.
# Install as lelamp-web-console.service.d/90-lelamp-hardware.conf.
# Restart the web service manually to apply groups/environment after review.
[Service]
SupplementaryGroups=dialout video audio
Environment="LELAMP_PORT=/dev/lelamp-servo"
Environment="OPENCLAW_ENABLE_HARDWARE=0"
Environment="OPENCLAW_ENABLE_RGB=0"
Environment="OPENCLAW_MIC_DEVICE=plughw:CARD=A311,DEV=0"
Environment="OPENCLAW_SPEAKER_DEVICE=plughw:CARD=A311,DEV=0"
